name: Veröffentlichen

on:
  push:
    branches: [main, claude/project-thread-b59xrs]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prüfen
        run: |
          npm run typecheck
          npm test
      - name: Oberfläche bauen
        run: npm run build
      - name: Cloudflare-Zugang prüfen
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen in den Repository-Secrets."
            exit 1
          fi
          npx wrangler whoami
      - name: Plattform-Datenbank anlegen
        run: node scripts/ensure-d1.mjs
      - name: Datenbank-Tabellen aktualisieren
        run: npx wrangler d1 migrations apply PLATFORM_DB --remote
      - name: Veröffentlichen
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Code Kontor ist online: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Gemini-Schlüssel hinterlegen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          else
            echo "::warning::Kein GEMINI_API_KEY in den Repository-Secrets. Der KI-Assistent zeigt „noch nicht eingerichtet“."
          fi
