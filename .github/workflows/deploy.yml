name: Veröffentlichen

on:
  push:
    branches: [main, claude/project-thread-b59xrs]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prüfen
        run: |
          npm run typecheck
          npm test
      - name: Oberfläche bauen
        run: npm run build
      - name: Cloudflare-Zugang prüfen
        run: |
          # Kopierte Werte bereinigen: Leerzeichen, Zeilenumbrüche, Anführungszeichen, "Bearer ".
          clean() { printf '%s' "$1" | tr -d ' \t\r\n"'"'" | sed -E 's/^(Bearer|bearer)//'; }
          TOKEN=$(clean "$CLOUDFLARE_API_TOKEN")
          ACCOUNT=$(clean "$CLOUDFLARE_ACCOUNT_ID")
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen in den Repository-Secrets."
            exit 1
          fi
          # Vertauscht? Die Account-ID besteht aus 32 Hex-Zeichen.
          if echo "$TOKEN" | grep -qE '^[0-9a-f]{32}$' && ! echo "$ACCOUNT" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::warning::Token und Account-ID waren vertauscht, ich nutze sie andersherum."
            TMP=$TOKEN; TOKEN=$ACCOUNT; ACCOUNT=$TMP
          fi
          echo "Token: ${#TOKEN} Zeichen, Account-ID: ${#ACCOUNT} Zeichen (erwartet: Token etwa 40, Account-ID 32)"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          CLOUDFLARE_API_TOKEN=$TOKEN CLOUDFLARE_ACCOUNT_ID=$ACCOUNT npx wrangler whoami
      - name: Plattform-Datenbank anlegen
        run: node scripts/ensure-d1.mjs
      - name: Datenbank-Tabellen aktualisieren
        run: npx wrangler d1 migrations apply PLATFORM_DB --remote
      - name: Geheimnisse vorbereiten
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          APP_URL: ${{ vars.APP_URL || 'https://codekontor.net' }}
        run: |
          # Die Geheimnisse gehen zusammen mit der neuen Version online (wrangler deploy --secrets-file).
          # Fehlende Einträge lassen vorhandene Geheimnisse unverändert.
          FILE="$RUNNER_TEMP/secrets.json"
          echo '{}' > "$FILE"
          add() { jq --arg k "$1" --arg v "$2" '. + {($k): $v}' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"; }
          # DATA_KEY einmalig erzeugen und nie überschreiben: ohne ihn lassen sich IBAN, Lohndaten und Zwei-Faktor-Geheimnisse nicht mehr lesen.
          # Bricht ab, wenn die Liste nicht gelesen werden kann, damit nie ein vorhandener Schlüssel ersetzt wird.
          SECRETS=$(npx wrangler secret list --format json)
          if echo "$SECRETS" | grep -q '"DATA_KEY"'; then
            echo "DATA_KEY ist vorhanden."
          else
            add DATA_KEY "$(openssl rand -base64 32 | tr -d '\n')"
            echo "DATA_KEY wird neu erzeugt."
          fi
          if [ -n "$GEMINI_API_KEY" ]; then add GEMINI_API_KEY "$GEMINI_API_KEY"; else
            echo "::warning::Kein GEMINI_API_KEY in den Repository-Secrets. Der KI-Assistent zeigt „noch nicht eingerichtet“."; fi
          if [ -n "$RESEND_API_KEY" ] && [ -n "$MAIL_FROM" ]; then add RESEND_API_KEY "$RESEND_API_KEY"; add MAIL_FROM "$MAIL_FROM"; else
            echo "::warning::Kein RESEND_API_KEY oder MAIL_FROM in den Repository-Secrets. E-Mails werden nicht gesendet."; fi
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            add STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
            HAS=0; echo "$SECRETS" | grep -q '"STRIPE_WEBHOOK_SECRET"' && HAS=1
            WHSEC=$(HAS_SECRET=$HAS node scripts/ensure-stripe-webhook.mjs)
            if [ -n "$WHSEC" ]; then echo "::add-mask::$WHSEC"; add STRIPE_WEBHOOK_SECRET "$WHSEC"; fi
          else
            echo "::warning::Kein STRIPE_SECRET_KEY in den Repository-Secrets. Die Abo-Bezahlung ist aus, niemand wird gesperrt."
          fi
          echo "Geheimnisse für diese Version: $(jq -r 'keys | join(", ")' "$FILE")"
      - name: Veröffentlichen
        run: |
          set -o pipefail
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" | tee deploy.log
          rm -f "$RUNNER_TEMP/secrets.json"
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Code Kontor ist online: $URL" >> "$GITHUB_STEP_SUMMARY"
